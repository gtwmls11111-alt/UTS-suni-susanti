<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechNews - Portal Berita Teknologi</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #172033;
  line-height: 1.6;
}

header {
  background: #101a32;
  color: white;
  padding: 20px 7%;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.logo span {
  color: #45d6d0;
}

header p {
  color: #cbd5e1;
  font-size: 13px;
  margin-top: 3px;
}

nav {
  background: #192746;
  padding: 12px 7%;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 8px 13px;
  border-radius: 7px;
  font-size: 14px;
}

nav a:hover,
nav a.active {
  background: #45d6d0;
  color: #101a32;
}

.container {
  width: 86%;
  max-width: 1150px;
  margin: 30px auto;
  min-height: 55vh;
}

.hero {
  background: linear-gradient(120deg, #101a32, #28558c);
  color: white;
  padding: 40px;
  border-radius: 18px;
  margin-bottom: 30px;
}

.label {
  display: inline-block;
  background: #45d6d0;
  color: #101a32;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 12px;
}

.hero h1 {
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.2;
  margin-bottom: 14px;
}

.hero p {
  color: #e2e8f0;
  margin-bottom: 20px;
  max-width: 650px;
}

.button {
  display: inline-block;
  background: #45d6d0;
  color: #101a32;
  padding: 10px 17px;
  border-radius: 7px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  border: none;
  cursor: pointer;
}

.button:hover {
  background: #fff;
}

.section-title {
  font-size: 25px;
  margin-bottom: 18px;
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  margin-bottom: 35px;
}

.card {
  background: white;
  border-radius: 13px;
  overflow: hidden;
  border: 1px solid #e1e7f0;
  box-shadow: 0 5px 16px #1720330d;
  transition: transform .2s;
}

.card:hover {
  transform: translateY(-4px);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #dce5f3;
}

.card-content {
  padding: 18px;
}

.category {
  color: #1769c2;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

.card h3 {
  font-size: 18px;
  line-height: 1.4;
  margin: 8px 0;
}

.card p {
  color: #657188;
  font-size: 14px;
  margin-bottom: 14px;
}

.read-more {
  color: #2563eb;
  font-weight: bold;
  font-size: 13px;
  text-decoration: none;
}

.page-heading {
  background: #172443;
  color: white;
  padding: 30px;
  border-radius: 15px;
  margin-bottom: 25px;
}

.page-heading h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

.page-heading p {
  color: #d7e2f4;
}

.article {
  background: white;
  padding: 30px;
  border-radius: 15px;
  border: 1px solid #e1e7f0;
}

.article h1 {
  font-size: clamp(26px, 4vw, 36px);
  line-height: 1.3;
  margin: 12px 0;
}

.article .cover {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: 12px;
  margin: 20px 0;
}

.article p {
  color: #48556c;
  margin: 15px 0;
  line-height: 1.9;
}

.article h2 {
  margin-top: 25px;
}

.meta {
  font-size: 12px;
  color: #7b8495;
}

footer {
  background: #101a32;
  color: white;
  text-align: center;
  padding: 25px 15px;
  margin-top: 40px;
}

footer p {
  color: #cbd5e1;
  font-size: 13px;
}

footer a {
  color: #45d6d0;
  text-decoration: none;
}

.empty {
  background: white;
  border-radius: 12px;
  padding: 25px;
}

@media (max-width: 800px) {
  .container {
    width: 92%;
  }

  header {
    padding: 18px 4%;
  }

  nav {
    padding: 10px 4%;
  }

  .news-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .hero {
    padding: 27px;
  }
}

@media (max-width: 540px) {
  .news-grid {
    grid-template-columns: 1fr;
  }

  .card img {
    height: 210px;
  }

  .hero {
    padding: 23px;
  }

  .page-heading,
  .article {
    padding: 22px;
  }

  nav a {
    font-size: 12px;
    padding: 7px 9px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Tech<span>News.</span></div>
  <p>Portal Informasi Teknologi Masa Kini</p>
</header>

<nav id="navigation">
  <a href="#beranda" data-page="beranda">Beranda</a>
  <a href="#teknologi" data-page="teknologi">Teknologi</a>
  <a href="#ai" data-page="ai">Artificial Intelligence</a>
  <a href="#keamanan" data-page="keamanan">Keamanan Digital</a>
</nav>

<main class="container" id="app">
  Memuat berita...
</main>

<footer>
  <div class="logo">Tech<span>News.</span></div>
  <p>Informasi teknologi, inovasi, dan dunia digital.</p>
  <p style="margin-top:10px">© 2026 TechNews | Proyek UTS HTML, CSS & JavaScript</p>
  <p style="margin-top:5px">
    <a href="#beranda">Beranda</a> ·
    <a href="#teknologi">Teknologi</a> ·
    <a href="#ai">AI</a> ·
    <a href="#keamanan">Keamanan Digital</a>
  </p>
</footer>

<script>
const berita = [
  {
    id: "ai",
    kategori: "Artificial Intelligence",
    judul: "Kecerdasan Buatan Membantu Pekerjaan dan Pembelajaran",
    ringkasan: "Teknologi AI dapat membantu mencari ide, memahami materi, dan menyelesaikan pekerjaan dengan lebih efisien.",
    gambar: "https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=900&q=80",
    tanggal: "13 Oktober 2026",
    isi: [
      "Kecerdasan buatan atau Artificial Intelligence (AI) merupakan teknologi yang memungkinkan komputer melakukan berbagai tugas, seperti memahami bahasa, mengenali pola, dan membantu menyelesaikan masalah.",
      "Dalam dunia pendidikan, AI dapat digunakan untuk mencari ide, menjelaskan materi yang sulit, dan membantu proses belajar. Namun, pengguna tetap perlu memeriksa kebenaran informasi yang diberikan.",
      "AI sebaiknya digunakan sebagai alat bantu, bukan sebagai pengganti pemikiran sendiri. Pengguna juga perlu menjaga privasi dan tidak sembarangan membagikan data pribadi."
    ]
  },
  {
    id: "smartphone",
    kategori: "Gadget",
    judul: "Perkembangan Smartphone Membawa Fitur yang Semakin Pintar",
    ringkasan: "Smartphone kini mendukung komunikasi, hiburan, pembelajaran, dan berbagai aktivitas sehari-hari.",
    gambar: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=80",
    tanggal: "13 Oktober 2026",
    isi: [
      "Smartphone menjadi salah satu perangkat digital yang banyak digunakan masyarakat. Selain berkomunikasi, perangkat ini dapat membantu belajar, bekerja, dan mengakses informasi.",
      "Perkembangan kamera, baterai, keamanan, dan fitur pintar membuat smartphone semakin beragam. Pengguna sebaiknya memilih perangkat sesuai kebutuhan dan anggaran.",
      "Agar tetap aman, gunakan kunci layar, perbarui sistem operasi, dan unduh aplikasi dari sumber resmi."
    ]
  },
  {
    id: "laptop",
    kategori: "Komputer",
    judul: "Tips Memilih Laptop yang Tepat untuk Mahasiswa",
    ringkasan: "Ketahui hal yang perlu diperhatikan saat memilih laptop untuk kuliah dan mengerjakan tugas.",
    gambar: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=80",
    tanggal: "12 Oktober 2026",
    isi: [
      "Laptop merupakan perangkat penting bagi mahasiswa untuk mengerjakan tugas, membuat presentasi, dan belajar pemrograman.",
      "Sebelum membeli laptop, perhatikan RAM, penyimpanan SSD, daya tahan baterai, berat perangkat, dan aplikasi yang akan digunakan.",
      "Tidak semua mahasiswa membutuhkan laptop dengan spesifikasi tinggi. Pilih perangkat yang sesuai kebutuhan dan anggaran."
    ]
  },
  {
    id: "keamanan",
    kategori: "Keamanan Digital",
    judul: "Cara Sederhana Melindungi Akun dan Data Pribadi",
    ringkasan: "Kata sandi yang kuat dan verifikasi dua langkah dapat membantu menjaga keamanan akun.",
    gambar: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=900&q=80",
    tanggal: "12 Oktober 2026",
    isi: [
      "Keamanan digital penting karena banyak aktivitas dilakukan melalui internet, mulai dari komunikasi hingga layanan pendidikan.",
      "Gunakan kata sandi yang kuat dan berbeda untuk setiap akun. Aktifkan verifikasi dua langkah jika tersedia dan jangan pernah membagikan kode OTP.",
      "Hindari tautan mencurigakan dan periksa alamat situs sebelum memasukkan informasi pribadi."
    ]
  },
  {
    id: "internet",
    kategori: "Internet",
    judul: "Pentingnya Memeriksa Informasi Sebelum Membagikannya",
    ringkasan: "Pengguna internet perlu memeriksa sumber agar tidak ikut menyebarkan informasi yang keliru.",
    gambar: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=900&q=80",
    tanggal: "11 Oktober 2026",
    isi: [
      "Internet membuat informasi dapat tersebar dengan cepat. Namun, informasi yang beredar belum tentu benar atau berasal dari sumber terpercaya.",
      "Periksa penerbit, tanggal publikasi, dan sumber lain sebelum mempercayai sebuah berita.",
      "Dengan kebiasaan memeriksa informasi, pengguna dapat membantu menciptakan lingkungan digital yang lebih sehat."
    ]
  },
  {
    id: "programming",
    kategori: "Pemrograman",
    judul: "Belajar Pemrograman Dimulai dari Membuat Proyek Sederhana",
    ringkasan: "Membuat halaman web sederhana dapat menjadi langkah awal untuk memahami pemrograman.",
    gambar: "https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=900&q=80",
    tanggal: "10 Oktober 2026",
    isi: [
      "Pemrograman adalah proses memberikan instruksi kepada komputer untuk menjalankan tugas tertentu.",
      "Pemula dapat memulai dengan HTML untuk struktur halaman, CSS untuk desain, dan JavaScript untuk interaksi.",
      "Latihan secara bertahap melalui proyek sederhana membantu memahami hubungan antara kode dan hasil yang tampil di layar."
    ]
  }
];

function kartu(item) {
  return `
    <article class="card">
      <a href="#detail/${item.id}">
        <img src="${item.gambar}" alt="${item.kategori}"
             onerror="this.style.display='none'">
      </a>
      <div class="card-content">
        <div class="category">${item.kategori}</div>
        <h3>${item.judul}</h3>
        <p>${item.ringkasan}</p>
        <div class="meta">${item.tanggal}</div>
        <br>
        <a class="read-more" href="#detail/${item.id}">Baca selengkapnya →</a>
      </div>
    </article>
  `;
}

function daftar(items) {
  return `<div class="news-grid">${items.map(kartu).join("")}</div>`;
}

function halamanBeranda() {
  return `
    <section class="hero">
      <div class="label">BERITA UTAMA</div>
      <h1>Jelajahi Dunia Teknologi Bersama TechNews</h1>
      <p>
        Dapatkan informasi seputar teknologi terbaru, kecerdasan buatan,
        gadget, pemrograman, dan keamanan digital.
      </p>
      <a class="button" href="#detail/ai">Baca Berita Utama →</a>
    </section>

    <h2 class="section-title">Berita Terbaru</h2>
    ${daftar(berita.slice(0, 3))}

    <h2 class="section-title">Berita Pilihan Editor</h2>
    ${daftar(berita.slice(3, 6))}
  `;
}

function halamanKategori(kategori, judul, deskripsi) {
  const hasil = berita.filter(item => item.kategori === kategori);
  return `
    <section class="page-heading">
      <h1>${judul}</h1>
      <p>${deskripsi}</p>
    </section>
    ${daftar(hasil)}
  `;
}

function halamanSemuaTeknologi() {
  return `
    <section class="page-heading">
      <h1>Berita Teknologi</h1>
      <p>Informasi gadget, komputer, internet, dan perkembangan dunia digital.</p>
    </section>
    ${daftar(berita)}
  `;
}

function halamanDetail(id) {
  const item = berita.find(b => b.id === id) || berita[0];
  return `
    <article class="article">
      <a class="read-more" href="#beranda">← Kembali ke Beranda</a>
      <br><br>
      <span class="category">${item.kategori}</span>
      <h1>${item.judul}</h1>
      <div class="meta">Redaksi TechNews · ${item.tanggal} · 4 menit baca</div>
      <img class="cover" src="${item.gambar}" alt="${item.kategori}"
           onerror="this.style.display='none'">
      <p><strong>${item.ringkasan}</strong></p>
      ${item.isi.map(paragraf => `<p>${paragraf}</p>`).join("")}
      <h2>Kesimpulan</h2>
      <p>
        Perkembangan teknologi memberikan banyak manfaat apabila digunakan
        dengan bijak. Terus belajar, periksa informasi, dan jaga keamanan
        saat beraktivitas di dunia digital.
      </p>
      <br>
      <a class="button" href="#teknologi">Lihat Berita Lainnya →</a>
    </article>
  `;
}

function render() {
  const route = decodeURIComponent(location.hash.slice(1) || "beranda");
  const bagian = route.split("/");
  const halaman = bagian[0];
  const app = document.getElementById("app");

  document.querySelectorAll("#navigation a").forEach(link => {
    link.classList.toggle("active", link.dataset.page === halaman);
  });

  if (halaman === "beranda") {
    app.innerHTML = halamanBeranda();
    document.title = "TechNews - Beranda";
  } else if (halaman === "teknologi") {
    app.innerHTML = halamanSemuaTeknologi();
    document.title = "Berita Teknologi - TechNews";
  } else if (halaman === "ai") {
    app.innerHTML = halamanKategori(
      "Artificial Intelligence",
      "Artificial Intelligence",
      "Berita dan informasi seputar kecerdasan buatan."
    );
    document.title = "Berita AI - TechNews";
  } else if (halaman === "keamanan") {
    app.innerHTML = halamanKategori(
      "Keamanan Digital",
      "Keamanan Digital",
      "Tips menjaga akun, perangkat, dan data pribadi."
    );
    document.title = "Keamanan Digital - TechNews";
  } else if (halaman === "detail") {
    app.innerHTML = halamanDetail(bagian[1]);
    document.title = "Detail Berita - TechNews";
  } else {
    app.innerHTML = halamanBeranda();
  }

  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
render();
</script>

</body>
</html>
